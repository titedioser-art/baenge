name: 방문자 수 자동 갱신

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 숫자만 확인하고 파일은 고치지 않음"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 방문자 수 확인 및 갱신
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python scripts/update_visitors.py

      - name: 변경사항 커밋
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "방문자 수 자동 갱신"
            git push
          else
            echo "변경사항 없음"
          fi
